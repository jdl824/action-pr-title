name: Labeler options
# labeler.yml

permissions:
  contents: read
  pull-requests: write
  
regex: '\S\w+[-]*\w+' # Regex the title should match.
allowed_prefixes: 'POS-,PSAI-,PSCPOS-,PS-,COUPON-,CDM-,MINMAX-,MMS-,SCD-,SWAT-,FH20-,RPTOE-,Patch,CMIS,RELEASE,Revert,XML' # title should start with the given prefix
prefix_case_sensitive: True # title prefix are case insensitive
min_length: 10 # Min length of the title
max_length: 50 # Max length of the title
help_message: 'Please use a valid title prefix: POS-,PSAI-,PSCPOS-,PS-,COUPON-,CDM-,MINMAX-,MMS-,SCD-,SWAT-,FH20-,RPTOE-,Patch,CMIS,RELEASE,Revert'
#flags:
#github_token:
